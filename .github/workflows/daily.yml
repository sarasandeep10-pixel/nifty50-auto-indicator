name: Daily Nifty Data Workflow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily.yml"
      - "collector/**"
      - "tests/**"
  schedule:
    # 18:00 IST, Monday to Friday. GitHub cron uses UTC.
    - cron: "30 12 * * 1-5"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile parser and tests
        run: python -m py_compile collector/parse_nse_reports.py tests/test_parser.py

      - name: Run parser regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify parser CLI
        run: python collector/parse_nse_reports.py --help
