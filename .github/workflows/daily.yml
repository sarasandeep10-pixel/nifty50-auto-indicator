name: Daily NSE Data Status Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily.yml"
      - "collector/**"
      - "tests/**"
  schedule:
    # 18:00 IST, Monday to Friday. GitHub cron uses UTC.
    - cron: "30 12 * * 1-5"

permissions:
  contents: read

jobs:
  validate-and-collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile scripts and tests
        run: python -m py_compile collector/parse_nse_reports.py collector/check_official_sources.py collector/fetch_official_reports.py collector/collect_fii_dii.py collector/validate_collection_status.py collector/download_nse_reports_browser.py tests/test_parser.py tests/test_collector.py tests/test_fii_dii.py tests/test_collection_status.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify parser CLI
        run: python collector/parse_nse_reports.py --help

      - name: Check official NSE source availability
        run: python collector/check_official_sources.py

      - name: Collect visible FII DII data from official page
        run: python collector/collect_fii_dii.py

      - name: Attempt direct-link participant report collection
        run: python collector/fetch_official_reports.py

      - name: Install browser automation for public report controls
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Attempt downloads through official NSE report UI
        continue-on-error: true
        run: python collector/download_nse_reports_browser.py

      - name: Validate collection completeness (report warnings without hiding artifacts)
        continue-on-error: true
        run: python collector/validate_collection_status.py

      - name: Upload collected data and status reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-nse-data-status
          path: data/processed/
          if-no-files-found: warn
          retention-days: 90

      - name: Upload collector diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-nse-collection-diagnostics
          path: data/official/
          if-no-files-found: warn
          retention-days: 30
