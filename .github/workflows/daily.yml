name: Daily NSE Data Status Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily.yml"
      - "collector/**"
      - "tests/**"
  schedule:
    # 18:00 IST, Monday to Friday. GitHub cron uses UTC.
    - cron: "30 12 * * 1-5"

permissions:
  contents: read

jobs:
  validate-and-check-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile scripts and tests
        run: python -m py_compile collector/parse_nse_reports.py collector/check_official_sources.py tests/test_parser.py

      - name: Run parser regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify parser CLI
        run: python collector/parse_nse_reports.py --help

      - name: Check official NSE source availability
        run: python collector/check_official_sources.py

      - name: Upload source status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-nse-source-status
          path: data/processed/official_source_status.json
          if-no-files-found: warn
          retention-days: 14
